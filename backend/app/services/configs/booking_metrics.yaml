# =============================================================================
# Booking METRIC semantics — business meaning, not file structure
# =============================================================================
# Companion to roster_metrics.yaml. The ingestion contract
# (validation/configs/booking.yaml) says what a valid booking FILE looks
# like; this says what its values MEAN to the dashboard.
#
# Confirmed with the business owner 2026-07-22:
#   The `Booked Hours Type` column holds the split, and hours are summed
#   from `Employee Booked Hours` per category.

version: 2

# ---------------------------------------------------------------------------
# Column roles — the booking-side equivalent of the roster's `columns:` block.
# ---------------------------------------------------------------------------
# The filters/cards/charts blocks below reference these ROLES so a renamed
# source column is a one-line change here rather than a hunt through Python.
# Hours-side columns still live under `hours:` for backward-compat with
# existing metric_config.booking_column() call sites (hours_type /
# hours_value); the validator seeds those two roles from the hours: block
# automatically so cards/charts can reference them uniformly.
columns:
  region: "Region (EC)"
  market: "Market (EC)"
  department: "Department"
  entity: "Team (EC)"
  holding: "Holding"
  hours_type: "Booked Hours Type"
  week_start: "Monday of Week"
  month: "Month"
  # Newly declared roles (Utilization Home config-driven work, 2026-07-24):
  # cards/charts now go through these instead of raw column names.
  employee: "Employee"
  # PROVISIONAL — the real DAX for `Total Projects` targets `Sheet1[Project]`
  # (a column that does not exist in the source file). Resolved to the file's
  # actual `Project Name` column, the only plausible match. Documented in
  # `docs/METRICS.md` under Page 7 as a PROVISIONAL note. If a `Project`
  # column later appears in the source, change this one line.
  project: "Project Name"

# ---------------------------------------------------------------------------
# Filters — the dropdowns the Utilization pages filter by.
# ---------------------------------------------------------------------------
# Same shape as the roster's `filters:` block. Values remain data-derived
# at request time by `booking_metrics.get_filter_options`; only the
# DEFINITIONS (label, hierarchy, page mapping) live here.
filters:
  # `order` — display order in the Search-page filter grid (ascending).
  # Explicit here so re-sequencing is a YAML edit, not a code edit; the
  # Search page reads it via `useFilterConfig` and sorts on it.
  # `searchable: true` — render a search input inside the dropdown (rule
  # of thumb: enable when the option list can plausibly exceed ~10
  # entries). See `docs/FILTERS.md` for the field conventions.
  employee:
    column_role: employee
    label: "Employee"
    type: multi
    applies_to_pages: [utilization-search, utilization-results, utilization-overview]
    order: 1
    searchable: true
  week:
    # Year > Month > Week is declared hierarchical; the Year/Month grouping
    # is derived on the frontend from the leaf `week_start` (Monday of Week)
    # via `weekHierarchyToItems`, so Year and Month are NOT separate filter
    # entries — the tree comes out of `/utilization/filter-options`'s
    # `week_hierarchy` shape. See `docs/FILTERS.md`.
    # `utilization-overview` was added 2026-07-26 so the Overview page's
    # KPIs + charts react to the selected week(s), same server-side filter
    # semantics as Utilization Home / Search / Results / Employee drill-through.
    column_role: week_start
    label: "Month / Week"
    type: hierarchical
    applies_to_pages: [utilization-home, utilization-search, utilization-results, employee-utilization, utilization-overview]
    order: 2
    searchable: true
  region:
    column_role: region
    label: "Region"
    type: multi
    nests: market
    applies_to_pages: [utilization-home, utilization-search, utilization-results, utilization-overview]
    order: 3
    searchable: true
  market:
    column_role: market
    label: "Market"
    type: multi
    applies_to_pages: [utilization-home, utilization-search, utilization-results, utilization-overview]
    order: 4
    searchable: true
  department:
    column_role: department
    label: "Department"
    type: multi
    applies_to_pages: [utilization-home, utilization-search, utilization-results, utilization-overview]
    order: 5
    searchable: true
  entity:
    column_role: entity
    label: "Entity"
    type: multi
    applies_to_pages: [utilization-search, utilization-results]
    order: 6
    searchable: true
  holding:
    column_role: holding
    label: "Holding"
    type: multi
    applies_to_pages: [utilization-search, utilization-results]
    order: 7
    searchable: true
  hours_type:
    column_role: hours_type
    label: "Hours Type"
    type: single
    applies_to_pages: [utilization-home, utilization-search, utilization-results, utilization-overview]
    order: 8
    # searchable omitted — only two values (Client / Internal); a search
    # input would be noise, not signal.

hours:
  # Column holding the number of hours to sum.
  value_column: "Employee Booked Hours"
  # Column holding the client-vs-internal category.
  type_column: "Booked Hours Type"
  # The two categories the Internal-v-Client donut splits on. If a new
  # category ever appears in the data it will NOT be silently dropped:
  # the `hours_split_covers_all_hours` invariant compares these against
  # the total and flags the difference on upload.
  client_label: "Client Hours"
  internal_label: "Internal Hours"

# ---------------------------------------------------------------------------
# Card definitions — what each KPI on the Utilization Home page counts.
# ---------------------------------------------------------------------------
# Same declarative shape as the roster's `cards:` block. Every card names
# a `measure_type` (distinct_count / sum / count_rows) and a `column_role`,
# so the computation follows the config rather than a bespoke function per
# card. A card that only counts rows matching a category (Client Hours,
# Internal Hours) also declares a `filter_column_role` + `filter_label_key`
# — the label_key is looked up in the `hours:` block so renaming the value
# ("Client Hours" -> "Billable Hours") is a one-line change there.
cards:
  # Distinct count of booking-sheet Employee values. DIFFERS by construction
  # from the roster's `total_employees` card (distinct NEW_EMP_ID over the
  # whole workforce file): this only counts employees who booked hours. The
  # cross-dataset upload check
  # (`cross_dataset._unmatched_warning_check("Employee", "roster", ...)`)
  # warns per booking-only Employee but never blocks the upload — see
  # docs/METRICS.md Page 7 "Previously..." for the roster vs booking
  # relationship. Real DAX measure name is "Total Employeess" (sic typo
  # preserved verbatim per data-model skill).
  total_employees_booking:
    label: "Total Employees"
    measure_type: distinct_count
    column_role: employee
    filter_scope: filtered

  total_hours:
    label: "Total Hours"
    measure_type: sum
    column_role: hours_value
    filter_scope: filtered
    # Real DAX: SUM('Sheet1'[Employee Booked Hours]).

  # Client / Internal split — same value column, different filter values.
  # `filter_label_key` names an entry in the `hours:` block so renaming
  # "Client Hours" -> "Billable Hours" is a one-line change there.
  client_hours:
    label: "Client Hours"
    measure_type: sum
    column_role: hours_value
    filter_column_role: hours_type
    filter_label_key: client_label
    filter_scope: filtered
  internal_hours:
    label: "Internal Hours"
    measure_type: sum
    column_role: hours_value
    filter_column_role: hours_type
    filter_label_key: internal_label
    filter_scope: filtered

  # PROVISIONAL COLUMN RESOLUTION — the real DAX references
  # `Sheet1[Project]`, but the source file has no `Project` column, only
  # `Project Name`. Resolved to `Project Name` as the only plausible match;
  # locked in the `project` column role above. Flagged in METRICS.md Page 7.
  total_projects:
    label: "Total Projects"
    measure_type: distinct_count
    column_role: project
    filter_scope: filtered

  # Utilization Search / Results — Average Hours KPI (the 5th tile on the
  # Results page's summary strip). `measure_type: mean` was introduced for
  # this card so per-row aggregations follow the same declared-in-YAML
  # pattern as sum/count. Empty filtered set -> 0.0 (dispatcher guards
  # against pandas' NaN mean on an empty frame). NOT a named DAX measure —
  # a Search/Results-specific summary tile with no Power BI counterpart,
  # flagged PROVISIONAL. See METRICS.md Page 7's "Search / Results" section.
  average_hours:
    label: "Average Hours"
    measure_type: mean
    column_role: hours_value
    filter_scope: filtered

  # ---------------------------------------------------------------------------
  # Utilization Overview page — 3 KPIs, all booking-derived (Formula A).
  # ---------------------------------------------------------------------------
  # `filter_scope` is documentary: it names WHICH slice the dispatcher receives
  # from the caller. The dispatcher itself never filters — the endpoint decides
  # what df to hand in. `whole_scope` = ignore the page's Hours Type / Project /
  # Employee filters (drill-through KPIs describe the entire employee /
  # holding). `filtered` = the endpoint pre-narrowed the frame (Utilization
  # Home / Search / Results). Neither value changes runtime behaviour today;
  # both are here so the CARD DECLARATION itself explains its scope choice
  # rather than only the endpoint's Python explaining it.
  #
  # `measure_type: ratio` — generic (num, denom) primitive with an optional
  # per-side filter. Introduced for Overview's booking-derived utilization
  # KPIs. Both the numerator's and the denominator's filter are optional so a
  # ratio can also expose things like "% of X where X is a subset over total",
  # not only client/total.
  #
  # `measure_type: avg_of_chart` — mean over the values of a declared chart's
  # output. Used by the Overview headline "Average Period Utilization %" so
  # the KPI and the Employee Ranking chart cannot compute the same per-
  # employee ratio two different ways (they route through the same chart
  # declaration). Follows the same "one declaration, no drift" contract as
  # the roster's `dimension_from_chart` reuse pattern (Skill Bifurcation charts).
  # `scope_to_latest_of_role` (optional) narrows the frame to rows whose
  # role-column value equals its max — used by Latest Week Utilization %.
  average_period_utilization_pct:
    label: "Average Period Utilization %"
    measure_type: avg_of_chart
    from_chart: employee_period_utilization
    filter_scope: whole_scope

  latest_week_utilization_pct:
    label: "Latest Week Utilization %"
    measure_type: avg_of_chart
    from_chart: employee_period_utilization
    scope_to_latest_of_role: week_start
    filter_scope: whole_scope

# ---------------------------------------------------------------------------
# Chart definitions — same idea as the roster's `charts:` block.
# ---------------------------------------------------------------------------
# `sum_by` sums a value column grouped by a category column, rather than
# counting rows — hours are a quantity, not a headcount. An optional
# `split_column_role` extends `sum_by` with a second dimension: rather
# than one value per group, each group is split across the values of the
# split column (used by the Weekly Hours Trend chart to give one bar per
# week with a Client/Internal stack).
#
# `sum_by_hierarchical` groups by TWO group roles (primary, secondary)
# and sums the value role — used by the Total Hours by Region / Market
# chart, which stacks Region + Market into one combined bar-label. The
# backend returns {primary, secondary, value} tuples; the frontend
# concatenates them into "Region/Market" display strings.
charts:
  # Home page (NOT Utilization Home). Kept unchanged.
  internal_vs_client_hours:
    label: "Internal v Client Utilization"
    type: sum_by
    group_column_role: hours_type    # Booked Hours Type
    value_column_role: hours_value   # Employee Booked Hours

  # Utilization Home — Weekly Hours Trend clustered bar. `split_column_role`
  # pivots the sum across Client/Internal per week, matching the
  # {week_start, client_hours, internal_hours} payload the endpoint returns
  # today.
  weekly_hours_trend:
    label: "Weekly Hours Trend"
    type: sum_by
    group_column_role: week_start
    value_column_role: hours_value
    split_column_role: hours_type

  # Utilization Home — combined Region / Market bar chart. UNCONFIRMED as
  # a named Power BI measure (no single DAX combines Region (EC) + Market
  # (EC) into one grouped total in the exported model). Renamed from the
  # original screenshot's "Total Hours by Market(EC) and Region(EC)" to
  # match METRICS.md house style (no source-column parentheticals). See
  # METRICS.md Page 7 for the UNCONFIRMED flag.
  total_hours_by_region_market:
    label: "Total Hours by Region / Market"
    type: sum_by_hierarchical
    primary_group_role: region
    secondary_group_role: market
    value_column_role: hours_value

  # ---------------------------------------------------------------------------
  # Utilization Overview page — booking-derived (Formula A) as of 2026-07-26.
  # ---------------------------------------------------------------------------
  # Every chart below is a Formula A projection off the booking sheet:
  # `Client Hours / (Client Hours + Internal Hours)`, computed per group
  # (aggregate-then-ratio: sum(client) / sum(total) within each group).
  # The roster and booking sheets are the only two data sources the app
  # reads (see METRICS.md's "Data sources" table).
  #
  # `ratio_by`: per-group aggregate-then-ratio. `aggregate: per_group` means
  # sum(num)/sum(denom) within each group (as opposed to averaging per-row
  # ratios) — matches Formula A's own construction applied at the group level.
  # A group with denominator=0 yields NaN in the raw computation and is
  # dropped from the returned dict (undefined utilization, not "0%").
  #
  # `avg_of_group_ratios`: for each `outer_group_role` value, restrict to
  # that subframe and compute a `ratio_by(inner_group_role)` on it, then
  # return the MEAN of those per-inner-group ratios. Used by the Weekly
  # Utilization Trend so each week's value is the mean of per-employee
  # ratios in that week — matching D1a's per-employee-first semantics
  # spread across each week rather than aggregating client/total at the
  # whole-week level (which would weight a heavy logger the same as a
  # light logger). Groups whose inner ratio is undefined (denom=0) are
  # excluded from the mean, not counted as 0.
  weekly_utilization_trend:
    label: "Weekly Utilization Trend"
    type: avg_of_group_ratios
    outer_group_role: week_start
    inner_group_role: employee
    numerator_column_role: hours_value
    denominator_column_role: hours_value
    numerator_filter_column_role: hours_type
    numerator_filter_label_key: client_label

  employee_period_utilization:
    label: "Employee Period Utilization %"
    type: ratio_by
    group_column_role: employee
    numerator_column_role: hours_value
    denominator_column_role: hours_value
    numerator_filter_column_role: hours_type
    numerator_filter_label_key: client_label
    aggregate: per_group

  # `ratio_bands`: bin the values of a `ratio_by` chart into declared bands.
  # Same first-match-wins `below` semantics as `numeric_bands`, and the last
  # band must omit `below` (catch-all). PROVISIONAL thresholds — see Page 8
  # of METRICS.md.
  utilization_split:
    label: "Utilization Split"
    type: ratio_bands
    ratio_from_chart: employee_period_utilization
    bands:
      - {label: "low", below: 0.80}
      - {label: "moderate", below: 0.90}
      - {label: "high"}   # >= 0.90 catch-all

  # ---------------------------------------------------------------------------
  # Employee drill-through page — same booking sheet, narrowed to one Employee.
  # ---------------------------------------------------------------------------
  # `sum_by_split` returns a projected `list[{group, split_1: v, split_2: v}]`
  # rather than a raw pivot table — so the endpoint can hand it straight to
  # the response model without a per-chart reshape. `sum_by` retains its raw
  # pivot return for callers that already project it (Utilization Home's
  # Weekly Hours Trend). See booking_metrics.evaluate_booking_chart.
  employee_hours_by_project:
    label: "Total Hours by Project"
    type: sum_by
    group_column_role: project
    value_column_role: hours_value

  employee_hours_by_week:
    label: "Total Hours by Week Start"
    type: sum_by_split
    group_column_role: week_start
    value_column_role: hours_value
    split_column_role: hours_type

  # ---------------------------------------------------------------------------
  # Project (Holding) drill-through page — narrowed to one Holding.
  # ---------------------------------------------------------------------------
  project_hours_by_employee:
    label: "Total Hours by Employee and Hours Type"
    type: sum_by_split
    group_column_role: employee
    value_column_role: hours_value
    split_column_role: hours_type

  project_hours_by_week:
    label: "Total Hours by Week Start and Hours Type"
    type: sum_by_split
    group_column_role: week_start
    value_column_role: hours_value
    split_column_role: hours_type
